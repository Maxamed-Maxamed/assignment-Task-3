name: Node.js CI

on:
  push:
    branches:
      - main
      - feature/ci-pipeline
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Generate test coverage
        run: npm run test:coverage